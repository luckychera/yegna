<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="./public/yegna_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#00202A" />
  <meta name="description"
    content="Yegna: stronger communities, brighter futures. Equb, Edir, Mahiber and community savings made simple and transparent." />
  <title>Yegna</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/main.tsx"></script>
  <script>
  (() => {
    try {
      const saved = localStorage.getItem('yegna-theme');
      const preference =
        saved === 'light' || saved === 'dark' || saved === 'system'
          ? saved
          : 'system';

      const systemDark = window.matchMedia(
        '(prefers-color-scheme: dark)'
      ).matches;

      const theme =
        preference === 'system'
          ? systemDark ? 'dark' : 'light'
          : preference;

      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.themePreference = preference;
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>

</body>

</html>
